name: Publish portfolio
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEMO_ORIGIN: ${{ vars.PUBLIC_DEMO_ORIGIN }}
      PORTFOLIO_BASE: /interview-portfolio/
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require a deployed HTTPS demo origin
        run: node -e 'const u = new URL(process.env.PUBLIC_DEMO_ORIGIN); if(u.protocol !== "https:" || !u.hostname.endsWith(".workers.dev")) process.exit(1)'
      - run: npm ci
      - run: npm run prepare:assets
      - run: npm run build --workspace portfolio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
