<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chatroom — Web Technologies HW5</title><meta name="description" content="即時互動課程作品：群聊、私人訊息、圖片分享、WebRTC 視訊與雙人格鬥。"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="demo.css"><script src="client.js" type="module"></script></head>
<body>
<section role="main" id="login-view" class="login-container" aria-labelledby="login-title"><a href="/">← 作品展示</a><div class="login-block"><img src="pic/chat_icon.png" alt="" width="48" height="48"><h1 id="login-title">Chatroom</h1><p>群聊、私人對話、視訊與雙人格鬥。</p><form id="login-form"><label for="nickname">暱稱</label><input id="nickname" maxlength="24" required autocomplete="nickname"><label for="lobby">房間代碼</label><input id="lobby" pattern="[a-z0-9-]{1,40}" maxlength="40" required aria-describedby="room-help"><p id="room-help">兩個瀏覽器輸入相同代碼即可一起展示。房間最多 8 人；訊息只暫存在展示服務中。</p><button type="submit" id="login-button">進入聊天室</button></form></div></section>
<div id="container" hidden>
 <aside id="sidebar"><div class="sidebar-header"><img src="pic/chat_icon.png" alt="" class="chatroom-icon"><h1 class="sidebar-title">Chatroom</h1></div><p>房間 <strong id="lobby-name"></strong></p><button id="copy-invite">複製邀請連結</button><button id="btn-group">群組聊天 <span id="star-group"></span></button><button id="btn-private">私人對話 <span id="star-private"></span></button><p>線上：<span id="online-count">0</span></p><ul id="user-list" aria-label="線上使用者"></ul><div class="video-window"><div><span>自己的畫面</span><video id="video-local" autoplay muted playsinline aria-label="本機視訊"></video></div><div><span>對方的畫面</span><video id="video-remote" autoplay playsinline aria-label="對方視訊"></video></div></div><p class="video-note">先選擇一位對象，再邀請視訊或遊戲。視訊需雙方同意；網路限制可能阻止直接連線。</p></aside>
 <main id="chat"><div class="video-controls-bar"><span class="video-title">視訊</span><button id="btn-toggle-camera" disabled>關閉攝影機</button><button id="btn-toggle-mic" disabled>麥克風靜音</button><label for="video-source">攝影機</label><select id="video-source"><option value="">預設攝影機</option></select><label for="audio-source">麥克風</label><select id="audio-source"><option value="">預設麥克風</option></select><button id="btn-video-start">邀請視訊</button><button id="btn-video-leave" disabled>結束視訊</button><div class="video-user-info"><img src="pic/user_icon.png" alt="" class="user-info-icon"><span id="username"></span><button id="btn-quit" aria-label="離開聊天室"><img src="pic/quit_icon.png" alt=""></button></div></div>
 <header id="chat-header"><h2>對話：<span id="chat-with">群組</span></h2></header><section id="messages" role="log" aria-label="對話紀錄" aria-relevant="additions" tabindex="0"></section><p id="typing" role="status"></p>
 <form id="chat-input"><button id="btn-image" type="button" aria-label="傳送圖片"><img src="pic/image_icon.png" alt=""></button><button id="btn-emoji" type="button" aria-label="選擇表情" aria-expanded="false"><img src="pic/smile_icon.png" alt=""></button><div id="emoji-picker" class="emoji-picker" hidden><button type="button">😀</button><button type="button">😂</button><button type="button">😍</button><button type="button">😉</button><button type="button">😢</button><button type="button">👍</button><button type="button">🙏</button></div><button id="btn-game" type="button" aria-label="邀請格鬥遊戲"><img src="pic/game_icon.png" alt=""></button><input type="file" id="image-input" accept="image/png,image/jpeg,image/webp" hidden><label class="sr-only" for="msg-input">訊息</label><input id="msg-input" placeholder="輸入訊息…" maxlength="1000" autocomplete="off" required><button id="send-btn" aria-label="傳送訊息"><img src="pic/send_icon.png" alt=""></button></form>
 </main>
</div>
<div class="connection"><p id="status" role="status">尚未連線</p><p id="error" role="alert"></p><button id="reconnect" hidden>重新連線</button></div>
<dialog id="invite-dialog" aria-labelledby="invite-title"><h2 id="invite-title"></h2><p id="invite-description"></p><div class="dialog-actions"><button id="accept-invite">接受</button><button id="decline-invite">婉拒</button></div></dialog>
<dialog id="game-dialog" aria-labelledby="game-title"><div class="game-header"><h2 id="game-title">雙人格鬥</h2><button id="close-game">結束對戰</button></div><div class="game-hud"><span id="health-a"></span><strong id="game-timer"></strong><span id="health-b"></span></div><canvas id="game-canvas" width="600" height="400" role="img" aria-label="雙人格鬥場地；生命值及操作說明見畫布前後文字"></canvas><p id="game-result" role="status"></p><p>你是 <strong id="game-player"></strong>。方向鍵移動／跳躍；1 近身攻擊、2 防禦、3 射擊。也可用下方按鈕。</p><div id="game-controls"><button data-key="l">← 左移</button><button data-key="r">右移 →</button><button data-key="j">↑ 跳躍</button><button data-key="close">1 攻擊</button><button data-key="def">2 防禦</button><button data-key="s">3 射擊</button></div></dialog>
</body></html>
